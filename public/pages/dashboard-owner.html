<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel del Dueño - Traslados Vans</title>
  <link rel="stylesheet" href="../css/styles.css">
  <meta name="theme-color" content="#1e40af">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #f0f4f8; padding: 20px; max-width: 1200px; margin: 0 auto; }
    .cabecera { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .btn-salir { padding: 10px 20px; background: #dc2626; color: white; border: none; border-radius: 8px; cursor: pointer; }
    .contadores { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .caja-contador { background: white; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .caja-contador .numero { font-size: 32px; font-weight: bold; color: #1e40af; margin-bottom: 5px; }
    .seccion { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .seccion h3 { color: #1e40af; margin-bottom: 15px; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; }
    .form-fila { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
    .form-fila input { padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; flex: 1; min-width: 180px; }
    .btn-principal { padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; }
    .btn-principal:hover { background: #1d4ed8; }
    .mensaje { margin-top: 10px; font-size: 14px; }
    .lista { margin-top: 15px; width: 100%; border-collapse: collapse; }
    .lista th, .lista td { padding: 10px; text-align: left; border-bottom: 1px solid #e2e8f0; }
  </style>
</head>
<body>

  <div class="cabecera">
    <h1>👑 Panel del Dueño</h1>
    <button class="btn-salir" id="btnSalir">Cerrar Sesión</button>
  </div>

  <!-- 📊 CONTADORES (LO QUE TENÍAS ANTES) -->
  <div class="contadores">
    <div class="caja-contador">
      <div class="numero" id="cantChoferes">0</div>
      <div>Choferes</div>
    </div>
    <div class="caja-contador">
      <div class="numero" id="cantViajes">0</div>
      <div>Viajes</div>
    </div>
    <div class="caja-contador">
      <div class="numero" id="cantAlertas">0</div>
      <div>Alertas</div>
    </div>
  </div>

  <!-- 🆕 CREAR ADMINISTRADOR -->
  <div class="seccion">
    <h3>👤 Crear Nuevo Administrador</h3>
    <div class="form-fila">
      <input type="text" id="adminNombre" placeholder="Nombre completo" required>
      <input type="email" id="adminCorreo" placeholder="correo@ejemplo.com" required>
      <input type="password" id="adminClave" placeholder="Contraseña temporal" required>
    </div>
    <button id="btnCrearAdmin" class="btn-principal">✅ Crear Administrador</button>
    <p id="msgAdmin" class="mensaje"></p>
  </div>

  <!-- 🚐 GESTIÓN DE CHOFERES -->
  <div class="seccion">
    <h3>🚐 Agregar Chofer</h3>
    <div class="form-fila">
      <input type="text" id="choferNombre" placeholder="Nombre completo" required>
      <input type="text" id="choferTel" placeholder="Teléfono" required>
    </div>
    <button id="btnAgregarChofer" class="btn-principal">Agregar Chofer</button>
    <p id="msgChofer" class="mensaje"></p>

    <h4 style="margin-top:20px;">Lista de Choferes</h4>
    <table class="lista" id="listaChoferes">
      <thead><tr><th>Nombre</th><th>Teléfono</th><th>Estado</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- ⚙️ CONFIGURACIÓN DE PRECIOS -->
  <div class="seccion">
    <h3>⚙️ Configuración de Precios</h3>
    <div class="form-fila">
      <input type="number" id="precioPersona" placeholder="Por Persona ($)">
      <input type="number" id="precioZona" placeholder="Por Zona ($)">
      <input type="number" id="precioKilo" placeholder="Por Kilómetro ($)">
      <input type="number" id="precioHora" placeholder="Por Hora ($)">
    </div>
    <button class="btn-principal">Guardar Precios</button>
  </div>

<script type="module" src="../js/dashboard-owner.js"></script>
</body>
</html>
