<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traslados Vans - Iniciar Sesión</title>
  <link rel="stylesheet" href="src/css/styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <h1>🚐 Traslados Vans</h1>
      <p class="subtitulo">Acceso al sistema</p>

      <div class="campo">
        <label>Correo electrónico</label>
        <input type="email" id="email" placeholder="tu@correo.com" required>
      </div>

      <div class="campo">
        <label>Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button id="btnIngresar" class="btn-principal">Ingresar</button>
      <p id="mensajeError" class="error"></p>
    </div>
  </div>

  <!-- Firebase -->
  <script type="module" src="src/js/firebase-config.js"></script>
  <script type="module" src="src/js/login.js"></script>
</body>
</html>
