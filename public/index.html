<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traslados Vans - Acceso</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e40af">
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <div class="logo">🚐</div>
      <h1>Traslados Vans</h1>
      <p class="subtitulo">Sistema de Gestión de Traslados</p>

      <div class="campo">
        <label>Correo electrónico</label>
        <input type="email" id="email" placeholder="tu@correo.com" required autocomplete="email">
      </div>

      <div class="campo">
        <label>Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button id="btnIngresar" class="btn-principal">Ingresar al Sistema</button>
      <p id="mensajeError" class="error"></p>
    </div>
  </div>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
